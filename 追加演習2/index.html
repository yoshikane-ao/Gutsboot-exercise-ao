<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>Sample1</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <script>
            var a, b;
            a = "Hello";
            b = "World";

            document.write(a + b + "!");


            var i;
            for (i =0; i <= 10; i++) {
                document.write(",", i);
            }

            // var i;
            // while(i <= 10) {
            //     i = i + 1;
            // }
            // document.write(i);


            var i;
            for (i = 10; i >= 0; i--) {
                document.write(",", i);
            }

            document.write("偶数だけ")

            var i;
            for (i = 0; i <= 10; i++) {
                if (i % 2 == 0) {
                    document.write(",", i);
                }
            }


            var i;
            for (i = 0; i <= 10; i++) {
                if (i % 2 != 0) {
                    document.write(",", i);
                }
            }


            for (i = 0; i <= 10; i++) {
                document.write("<br>", i)
            }

            var i = 0;
            document.write(i);
            while (i <= 10) {
                i = i + 1;
                document.write("<br>", i);
            }

            var i = 0;
            do {
                i = i + 1;
                document.write("<br>", i);
            } while(i <= 10);


            for (i = 1; i <= 5; i++) {
                document.write("<img src='study.jpg'>")
            }
                
        </script>
    </body>
</html>
